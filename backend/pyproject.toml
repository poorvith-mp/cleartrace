[project]
name = "cleartrace-backend"
version = "1.0.0"
description = "ClearTrace Consent-Based Personal Data Removal Backend Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "faker>=30.8.0",
    "rapidfuzz>=3.10.0",
    "httpx>=0.27.2",
    "pytest>=8.3.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
